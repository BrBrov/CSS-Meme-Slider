<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Meme Sliders</title>
  <link rel="icon" href="./assets/favicon.jpg" type="img/jpg">
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="page">
    <header class="header">
      <h1 class="header__title">CSS Meme Slider</h1>
    </header>
    <main class="main">
      <div class="main__slider">
        <input type="radio" name="cliker" id="main__btn-1" checked class="main__clicker">
        <input type="radio" name="cliker" id="main__btn-2" class="main__clicker">
        <input type="radio" name="cliker" id="main__btn-3" class="main__clicker">
        <input type="radio" name="cliker" id="main__btn-4" class="main__clicker">
        <div class="main__container">
          <img class="main__slide" src="./assets/1.webp" alt="Slide1" />
          <img class="main__slide" src="./assets/2.webp" alt="Slide2" />
          <img class="main__slide" src="./assets/3.webp" alt="Slide3" />
          <img class="main__slide" src="./assets/4.webp" alt="Slide4" />
        </div>
        <div class="main__slides-info">
          <div class="main__slides-text">
            <p class="main__slide-text">Your chiropractor’s favorite customer.</p>
            <p class="main__slide-text">Faster than sound. Faster than your budget.</p>
            <p class="main__slide-text">Built for the mountains. Conquers the curb.</p>
            <p class="main__slide-text">0 to 60 mph in three screaming kids.</p>
          </div>
          <div class="main__controls">
            <label class="main__control" for="main__btn-1">
              <div class="main__control-dot"></div>
            </label>
            <label class="main__control" for="main__btn-2">
              <div class="main__control-dot"></div>
            </label>
            <label class="main__control" for="main__btn-3">
              <div class="main__control-dot"></div>
            </label>
            <label class="main__control" for="main__btn-4">
              <div class="main__control-dot"></div>
            </label>
          </div>
        </div>
      </div>
    </main>
    <footer class="footer">
      <a class="footer__link" href="https://github.com/BrBrov/CSS-Meme-Slider.git">Git Link</a>
    </footer>
  </div>
</body>

</html>
